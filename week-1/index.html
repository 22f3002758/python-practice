<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 1 · Python Practice</title>
  <meta name="description" content="Four Week 1 Python revision papers: introduction, variables, and basic operations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=JetBrains+Mono:wght@500;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f8fc;
      --paper: #ffffff;
      --ink: #172033;
      --muted: #5d687c;
      --line: #dce2ee;
      --blue: #1a73e8;
      --blue-soft: #e8f0fe;
      --radius: 8px;
      --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a { color: inherit; }

    .bar {
      flex: none;
      background:
        linear-gradient(90deg, rgba(26, 115, 232, 0.07) 1px, transparent 1px),
        linear-gradient(0deg, rgba(26, 115, 232, 0.07) 1px, transparent 1px),
        var(--paper);
      background-size: 44px 44px;
      border-bottom: 1px solid var(--line);
    }

    .bar-inner {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding-top: 14px;
    }

    .crumbs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 800;
      text-decoration: none;
    }

    .brand:hover .back { color: var(--blue); }

    .mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: var(--radius);
      background: var(--blue);
      color: white;
      font-weight: 900;
    }

    .back { color: var(--muted); }

    .solo {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.74rem;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .solo:hover { color: var(--blue); }

    .heading { margin: 14px 0 12px; }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--blue);
      font-family: var(--mono);
      font-size: 0.74rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, "Times New Roman", serif;
      font-size: clamp(1.35rem, 3vw, 1.9rem);
      font-weight: 800;
      line-height: 1.15;
    }

    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: none;
      padding: 10px 16px 11px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: none;
      color: var(--muted);
      font: 800 0.86rem/1 var(--mono);
      text-decoration: none;
      cursor: pointer;
    }

    .tab:hover { color: var(--ink); }

    .tab:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: -2px;
      border-radius: 4px 4px 0 0;
    }

    .tab[aria-selected="true"] {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    .panels {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    .panels iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }

    .panels iframe[hidden] { display: none; }

    @media (max-width: 640px) {
      .bar-inner { width: calc(100% - 24px); padding-top: 10px; }
      .heading { margin: 10px 0 6px; }
      .solo-label { display: none; }
      .tab { padding: 10px 12px 11px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <div class="crumbs">
        <a class="brand" href="../"><span class="mark">Py</span><span class="back">← All weeks</span></a>
        <a class="solo" id="solo" href="#" target="_blank" rel="noopener">↗ <span class="solo-label">Open paper in new tab</span></a>
      </div>
      <div class="heading">
        <p class="eyebrow">Week 1 · Revision papers</p>
        <h1>Introduction, variables, and basic operations</h1>
      </div>
      <nav class="tabs" role="tablist" aria-label="Papers" id="tabs"></nav>
    </div>
  </header>
  <main class="panels" id="panels"></main>

  <script>
    // Papers in this week. Each id is the URL hash (week-1/#paper-1); each file sits next to this page.
    const PAPERS = [1, 2, 3, 4].map(n => ({ id: `paper-${n}`, label: `Paper ${n}`, file: `week1-paper${n}.html` }));

    const tabs = document.getElementById('tabs');
    const panels = document.getElementById('panels');
    const solo = document.getElementById('solo');
    const frames = {};

    // Opened from disk (file://), a folder link shows a directory listing instead of index.html.
    if (location.protocol === 'file:') document.querySelector('.brand').href = '../index.html';

    for (const p of PAPERS) {
      const tab = document.createElement('a');
      tab.className = 'tab';
      tab.id = `tab-${p.id}`;
      tab.href = `#${p.id}`;
      tab.textContent = p.label;
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-controls', `panel-${p.id}`);
      tabs.append(tab);
    }

    // Each paper loads the first time its tab opens and then stays in the page, so answers survive tab switches.
    function frameFor(p) {
      if (!frames[p.id]) {
        const frame = document.createElement('iframe');
        frame.id = `panel-${p.id}`;
        frame.title = p.label;
        frame.src = p.file;
        frame.setAttribute('role', 'tabpanel');
        frame.setAttribute('aria-labelledby', `tab-${p.id}`);
        panels.append(frame);
        frames[p.id] = frame;
      }
      return frames[p.id];
    }

    function show() {
      const current = PAPERS.find(p => `#${p.id}` === location.hash) || PAPERS[0];
      if (location.hash !== `#${current.id}`) history.replaceState(null, '', `#${current.id}`);
      const frame = frameFor(current);
      for (const f of Object.values(frames)) f.hidden = f !== frame;
      for (const tab of tabs.children) {
        const selected = tab.id === `tab-${current.id}`;
        tab.setAttribute('aria-selected', selected);
        tab.tabIndex = selected ? 0 : -1;
        if (selected) tab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
      solo.href = current.file;
      document.title = `Week 1 ${current.label} · Python Practice`;
    }

    tabs.addEventListener('keydown', e => {
      const list = [...tabs.children];
      const i = list.indexOf(document.activeElement);
      const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      if (i < 0 || !step) return;
      const next = list[(i + step + list.length) % list.length];
      next.focus();
      next.click();
      e.preventDefault();
    });

    window.addEventListener('hashchange', show);
    show();
  </script>
</body>
</html>
